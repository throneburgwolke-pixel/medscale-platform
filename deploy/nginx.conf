# ─────────────────────────────────────────────────────────────────────────────
# 医学量表与问卷平台 · nginx 反向代理（备选方案）
#
# 只在 Caddy 装不上时用这套 —— 例如服务器访问 dl.cloudsmith.io 很慢。
# nginx 与 certbot 都在 Ubuntu / Debian 官方源里，国内镜像下载通常没问题。
#
# 安装位置：/etc/nginx/sites-available/medscale
# deploy/install.sh --proxy nginx 会自动放好并调用 certbot 申请证书。
#
# 这份配置故意只写 80 端口：certbot 会自己把 443 的 server 块和证书路径
# 补进来（并加上 80→443 跳转）。手工写死证书路径反而会在首次
# 申请前让 nginx 启动失败。
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name scales.example.com;

    # 应用自身的请求体上限是 20 MB，这里留余量。
    # 默认值是 1m，不改的话「恢复一份大备份」会直接 413。
    client_max_body_size 24m;

    # 备份下载、大问卷提交可能耗时，别让代理先超时断开
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_connect_timeout 10s;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 应用侧必须同时设 MEDSCALE_TRUST_PROXY=1，否则上面两个头一律不认。
        # 这是防伪造：谁都能自己加一个 X-Forwarded-For 绕过登录限流。
    }
}
